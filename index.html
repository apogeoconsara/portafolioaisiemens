<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Finance Console</title>
<meta name="description" content="A working automation tool for a Digital Finance role: a SAP FI/CO-style data pipeline, KPI dashboard, in-browser SQL explorer, and a Claude-powered executive summary and assistant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="assets/vendor/chart.umd.min.js"></script>
<script src="assets/vendor/alasql.min.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-shell">

  <header class="topnav">
    <div class="brand">
      <span class="brand-mark">DF</span>
      <p class="brand-name" data-i18n="app.title"></p>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="pipeline" data-i18n="nav.pipeline"></button>
      <button class="nav-item" data-view="dashboard" data-i18n="nav.dashboard"></button>
      <button class="nav-item" data-view="sql" data-i18n="nav.sql"></button>
      <button class="nav-item" data-view="ai" data-i18n="nav.ai"></button>
      <button class="nav-item" data-view="management" data-i18n="nav.management"></button>
    </nav>

    <button class="nav-item nav-cta" data-view="downloads" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
      <span data-i18n="nav.downloads"></span>
    </button>

    <div class="lang-toggle" id="langToggle">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
  </header>

  <main class="main">

    <div class="topbar">
      <div>
        <h1 id="viewTitle"></h1>
        <p id="viewDesc"></p>
      </div>
    </div>

    <div class="view-container">

      <!-- PIPELINE -->
      <section class="view active" data-view="pipeline" data-group="pipeline">
        <div class="controls-row">
          <button id="loadSampleBtn" class="btn btn-primary" data-i18n="pipeline.loadSample"></button>
          <button id="runPipelineBtn" class="btn btn-ghost" data-i18n="pipeline.run"></button>
          <span id="pipelineStatus" class="data-status" data-i18n="pipeline.status.idle"></span>
        </div>

        <div class="steps-row" id="stepsRow">
          <div class="step" data-step="extract"><div class="step-dot">1</div><div><h4 data-i18n="pipeline.step.extract"></h4><p data-i18n="pipeline.step.extract.desc"></p></div></div>
          <div class="step" data-step="validate"><div class="step-dot">2</div><div><h4 data-i18n="pipeline.step.validate"></h4><p data-i18n="pipeline.step.validate.desc"></p></div></div>
          <div class="step" data-step="transform"><div class="step-dot">3</div><div><h4 data-i18n="pipeline.step.transform"></h4><p data-i18n="pipeline.step.transform.desc"></p></div></div>
          <div class="step" data-step="load"><div class="step-dot">4</div><div><h4 data-i18n="pipeline.step.load"></h4><p data-i18n="pipeline.step.load.desc"></p></div></div>
        </div>

        <div class="pipeline-grid">
          <div class="panel">
            <h3 data-i18n="pipeline.quality.title"></h3>
            <ul id="qualityList" class="quality-list"></ul>
          </div>
          <div class="panel">
            <h3 data-i18n="pipeline.log.title"></h3>
            <div id="automationLog" class="automation-log"><p class="muted" data-i18n="pipeline.log.empty"></p></div>
          </div>
        </div>
      </section>

      <!-- DASHBOARD -->
      <section class="view" data-view="dashboard" data-group="dashboard">
        <div class="kpi-row" id="kpiRow"></div>
        <div class="chart-grid">
          <div class="chart-card"><h3 data-i18n="dashboard.chart.budget"></h3><canvas id="chartBudget"></canvas></div>
          <div class="chart-card"><h3 data-i18n="dashboard.chart.variance"></h3><canvas id="chartVariance"></canvas></div>
          <div class="chart-card"><h3 data-i18n="dashboard.chart.inventory"></h3><canvas id="chartInventory"></canvas></div>
          <div class="chart-card"><h3 data-i18n="dashboard.chart.productivity"></h3><canvas id="chartProductivity"></canvas></div>
        </div>
      </section>

      <!-- SQL -->
      <section class="view" data-view="sql" data-group="sql">
        <div class="sql-examples">
          <span data-i18n="sql.examples"></span>
          <button class="chip" data-sql="unmastered" data-i18n="sql.example.unmastered"></button>
          <button class="chip" data-sql="blocked" data-i18n="sql.example.blocked"></button>
          <button class="chip" data-sql="overspend" data-i18n="sql.example.overspend"></button>
          <button class="chip" data-sql="productivity" data-i18n="sql.example.productivity"></button>
        </div>
        <textarea id="sqlInput" class="sql-input" spellcheck="false"></textarea>
        <div class="controls-row">
          <button id="runSqlBtn" class="btn btn-primary" data-i18n="sql.run"></button>
          <span id="sqlStatus" class="data-status"></span>
        </div>
        <div class="sql-result-wrap">
          <table class="sql-result" id="sqlResult"></table>
        </div>
      </section>

      <!-- INSIGHTS -->
      <section class="view" data-view="insights" data-group="ai">
        <div class="section-head"><h2 data-i18n="insights.title"></h2><p data-i18n="insights.desc"></p></div>
        <div class="controls-row">
          <button id="generateInsightsBtn" class="btn btn-primary" data-i18n="insights.generate"></button>
        </div>
        <p id="insightsNote" class="muted note"></p>
        <div id="insightsBody" class="insights-body"></div>
      </section>

      <!-- ASSISTANT -->
      <section class="view" data-view="assistant" data-group="ai">
        <div class="section-head"><h2 data-i18n="assistant.title"></h2><p data-i18n="assistant.desc"></p></div>
        <div class="chat-window">
          <div id="chatLog" class="chat-log"></div>
          <div class="chat-suggestions" id="chatSuggestions"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" autocomplete="off">
            <button type="submit" class="btn btn-primary" data-i18n="assistant.send"></button>
          </form>
        </div>
      </section>


      <!-- ROADMAP -->
      <section class="view" data-view="roadmap" data-group="management">
        <div class="section-head"><h2 data-i18n="roadmap.title"></h2><p data-i18n="roadmap.desc"></p></div>
        <div class="roadmap-grid">
          <div class="chart-card chart-tall"><h3 data-i18n="roadmap.chart.title"></h3><canvas id="chartRoadmap"></canvas><div class="status-legend" id="roadmapLegend"></div></div>
          <div class="panel panel-flush">
            <h3 data-i18n="roadmap.table.title"></h3>
            <div class="chip-row" id="roadmapFilters"></div>
            <div class="table-wrap"><table class="gov-table" id="roadmapTable"></table></div>
            <p class="muted fineprint" data-i18n="roadmap.method"></p>
          </div>
        </div>
      </section>

      <!-- CONTROLS -->
      <section class="view" data-view="controls" data-group="management">
        <div class="section-head"><h2 data-i18n="controls.title"></h2><p data-i18n="controls.desc"></p></div>
        <div class="chip-row" id="controlsTabs">
          <button class="chip" data-ctab="matrix" data-i18n="controls.tab.matrix"></button>
          <button class="chip" data-ctab="kpis" data-i18n="controls.tab.kpis"></button>
          <button class="chip" data-ctab="ownership" data-i18n="controls.tab.ownership"></button>
        </div>
        <div id="controlsBody">
          <div data-ctab="matrix">
            <p class="summary-line" id="controlsSummary"></p>
            <div class="table-wrap"><table class="gov-table" id="controlsTable"></table></div>
          </div>
          <div data-ctab="kpis" hidden>
            <div class="table-wrap"><table class="gov-table" id="kpiTable"></table></div>
          </div>
          <div data-ctab="ownership" hidden>
            <div class="table-wrap"><table class="gov-table" id="ownerTable"></table></div>
            <div class="panel lineage-panel">
              <h3 data-i18n="own.lineage.title"></h3>
              <div class="lineage" id="lineage"></div>
              <p class="muted fineprint" data-i18n="own.lineage.note"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- AUTOMATION -->
      <section class="view" data-view="automation" data-group="management">
        <div class="section-head"><h2 data-i18n="automation.title"></h2><p data-i18n="automation.desc"></p></div>
        <div class="panel">
          <h3 data-i18n="automation.workflow.title"></h3>
          <div id="workflowSvg" class="workflow"></div>
          <p class="muted fineprint" data-i18n="automation.workflow.note"></p>
        </div>
        <div class="panel impact-panel">
          <h3 data-i18n="automation.impact.title"></h3>
          <p class="muted fineprint" data-i18n="automation.impact.note"></p>
          <div class="impact-grid">
            <div id="impactInputs"></div>
            <div>
              <div class="kpi-row kpi-row-3" id="impactOutputs"></div>
              <div class="chart-card chart-short"><h3 data-i18n="automation.chart.title"></h3><canvas id="chartImpact"></canvas></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ENABLEMENT -->
      <section class="view" data-view="enablement" data-group="downloads">
        <div class="downloads" id="downloads">
          <div class="download-card">
            <div class="dl-icon">BI</div>
            <h3 data-i18n="dl.pbi.title"></h3>
            <p data-i18n="dl.pbi.desc"></p>
            <a class="btn btn-primary" href="entregables/PowerBI_DigitalFinance.zip" download data-i18n="dl.button.zip"></a>
            <details class="dl-how">
              <summary data-i18n="dl.pbi.how"></summary>
              <ol>
                <li data-i18n="dl.pbi.s1"></li>
                <li data-i18n="dl.pbi.s2"></li>
                <li data-i18n="dl.pbi.s3"></li>
              </ol>
            </details>
          </div>
          <div class="download-card">
            <div class="dl-icon dl-xlsx">XL</div>
            <h3 data-i18n="dl.xlsx.title"></h3>
            <p data-i18n="dl.xlsx.desc"></p>
            <a class="btn btn-primary" href="entregables/Digital_Finance_Analisis.xlsx" download data-i18n="dl.button.xlsx"></a>
          </div>
          <div class="download-card">
            <div class="dl-icon dl-pdf">PDF</div>
            <h3 data-i18n="dl.pdf.title"></h3>
            <p data-i18n="dl.pdf.desc"></p>
            <a class="btn btn-primary" href="entregables/Guia_de_usuario.pdf" download data-i18n="dl.button.pdf"></a>
          </div>
        </div>
        <div class="enable-grid">
          <div class="panel">
            <h3 data-i18n="enablement.quick.title"></h3>
            <ol class="quick-start" id="quickStart"></ol>
          </div>
          <div class="panel">
            <h3 data-i18n="enablement.faq.title"></h3>
            <div id="faqList"></div>
          </div>
        </div>
      </section>
    </div>

    <footer class="page-footer" data-i18n="sidebar.footer"></footer>
  </main>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data-engine.js"></script>
<script src="assets/js/sql-engine.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/assistant-fallback.js"></script>
<script src="assets/js/governance-data.js"></script>
<script src="assets/js/governance.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
